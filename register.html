<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nexura Store - Create your account">
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
    <title>Nexura Store | Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#FF6B00', secondary: '#2B2D42', accent: '#FFE8D6' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .grid-bg {
            background-color: #f8fafc;
            background-image: linear-gradient(to right, #e2e8f0 1px, transparent 1px), linear-gradient(to bottom, #e2e8f0 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .dark .grid-bg {
            background-color: #0f1115;
            background-image: linear-gradient(to right, #1e293b 1px, transparent 1px), linear-gradient(to bottom, #1e293b 1px, transparent 1px);
        }
    </style>
    <style>
        /* Premium Nav Hover Line Effect */
        #main-nav-links > a, #main-nav-links > div > button {
            position: relative;
        }
        #main-nav-links > a::after, #main-nav-links > div > button::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: #FF6B00; /* Primary color */
            transition: width 0.3s ease-in-out;
            border-radius: 2px;
        }
        #main-nav-links > a:hover::after, #main-nav-links > div:hover > button::after {
            width: 100%;
        }
    </style>
</head>
<body class="antialiased grid-bg min-h-screen py-10 flex flex-col items-center justify-center relative transition-colors duration-300">

    <!-- Top Right Nav -->
    <nav class="absolute top-0 end-0 p-6 z-50">
        <div class="flex items-center gap-2">
            <button id="theme-toggle" class="w-10 h-10 rounded-full flex items-center justify-center text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-800 shadow hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors border border-gray-300 dark:border-gray-600">
                <i class="fa-solid fa-moon"></i>
            </button>
            <button id="rtl-toggle" class="w-10 h-10 rounded-full flex items-center justify-center text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-800 shadow hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors border border-gray-300 dark:border-gray-600">
                <i class="fa-solid fa-right-left"></i>
            </button>
        </div>
    </nav>

    <!-- Centered Card Layout -->
    <div class="bg-white dark:bg-gray-800 w-full max-w-[32rem] rounded-[2rem] shadow-xl p-8 md:p-10 z-10 border border-gray-300 dark:border-gray-600">
        
        <!-- Header & Logo -->
        <div class="flex flex-col items-center mb-6">
            <a href="index.html" class="flex items-center gap-3 mb-5 inline-flex group cursor-pointer">
                <img src="assets/images/logo.svg" alt="Nexura Logo" class="w-10 h-10 drop-shadow-lg group-hover:scale-105 transition-transform">
                <span class="font-bold text-2xl tracking-tight text-primary uppercase">Nexura</span>
            </a>
            <h1 class="text-2xl font-semibold text-gray-900 dark:text-white mb-2 tracking-tight">Create Account</h1>
        </div>

        <!-- Form -->
        <form class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-200 mb-1.5">First Name</label>
                    <input type="text" class="w-full px-4 py-2.5 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-xl text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder-gray-400 text-sm" placeholder="First name" required>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-200 mb-1.5">Last Name</label>
                    <input type="text" class="w-full px-4 py-2.5 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-xl text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder-gray-400 text-sm" placeholder="Last name" required>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 dark:text-gray-200 mb-1.5">Email Address</label>
                <input type="email" class="w-full px-4 py-2.5 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-xl text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder-gray-400 text-sm" placeholder="e.g. secure@example.com" required>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-200 mb-1.5">Password</label>
                    <div class="relative">
                        <input type="password" class="w-full ps-4 pe-11 py-2.5 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-xl text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder-gray-400 text-sm" placeholder="Create password" required>
                        <button type="button" class="absolute inset-y-0 end-0 pe-4 flex items-center text-gray-400 hover:text-gray-800 dark:hover:text-gray-200">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-200 mb-1.5">Confirm Password</label>
                    <div class="relative">
                        <input type="password" class="w-full ps-4 pe-11 py-2.5 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-xl text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder-gray-400 text-sm" placeholder="Repeat password" required>
                        <button type="button" class="absolute inset-y-0 end-0 pe-4 flex items-center text-gray-400 hover:text-gray-800 dark:hover:text-gray-200">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="flex items-center py-1">
                <input type="checkbox" id="terms" class="w-4 h-4 text-primary bg-white border-gray-300 rounded focus:ring-primary dark:focus:ring-primary dark:ring-offset-gray-900 focus:ring-2 dark:bg-gray-800 dark:border-gray-600 cursor-pointer" required>
                <label for="terms" class="ms-2 text-xs font-medium text-gray-800 dark:text-gray-200 cursor-pointer">
                    I agree to the <a href="#" class="text-primary hover:underline">Terms</a> & <a href="#" class="text-primary hover:underline">Privacy Policy</a>
                </label>
            </div>

            <button type="submit" class="w-full bg-primary hover:bg-[#e66000] text-white font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-orange-500/30 flex items-center justify-center gap-2">
                <i class="fa-solid fa-lock text-sm"></i> Register Account
            </button>
        </form>

        <!-- Divider -->
        <div class="mt-5 mb-5 flex items-center gap-4">
            <div class="h-px bg-gray-200 dark:bg-gray-800 flex-grow"></div>
            <span class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Or sign up with</span>
            <div class="h-px bg-gray-200 dark:bg-gray-800 flex-grow"></div>
        </div>

        <!-- Social Icons -->
        <div class="flex justify-center gap-4 mb-5">
            <button class="w-11 h-11 flex items-center justify-center border border-gray-300 dark:border-gray-600 rounded-full hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors text-gray-700 dark:text-gray-200">
                <i class="fa-brands fa-google"></i>
            </button>
            <button class="w-11 h-11 flex items-center justify-center border border-gray-300 dark:border-gray-600 rounded-full hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors text-blue-600">
                <i class="fa-brands fa-facebook-f"></i>
            </button>
            <button class="w-11 h-11 flex items-center justify-center border border-gray-300 dark:border-gray-600 rounded-full hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors text-black dark:text-white">
                <i class="fa-brands fa-apple"></i>
            </button>
        </div>

        <!-- Login Link -->
        <a href="login.html" class="w-full block text-center border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 hover:border-primary hover:text-primary font-bold py-3 rounded-xl transition-colors text-sm">
            Already have an account? Log In
        </a>
    </div>

    <!-- Script to toggle themes -->
    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const htmlClass = document.documentElement.classList;
        themeToggle.addEventListener('click', () => {
            if(htmlClass.contains('dark')) {
                htmlClass.remove('dark');
            } else {
                htmlClass.add('dark');
            }
        });
    </script>
</body>
</html>
