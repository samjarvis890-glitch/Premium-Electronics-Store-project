<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nexura Store - Page Not Found">
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
    <title>404 Not Found | Nexura Store</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS (CDN for utility classes) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#FF6B00',
                        secondary: '#2B2D42',
                        accent: '#FFE8D6',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="antialiased transition-colors duration-300 bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-900 dark:to-black min-h-screen flex items-center justify-center overflow-hidden">
    
    <!-- Abstract Background Shapes -->
    <div class="absolute top-0 end-0 -me-20 -mt-20 w-96 h-96 rounded-full bg-primary opacity-10 blur-3xl"></div>
    <div class="absolute bottom-0 start-0 -ms-20 -mb-20 w-80 h-80 rounded-full bg-secondary opacity-10 blur-3xl"></div>

    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10 animate-fade-in-up">
        <div class="inline-block mb-6">
            <span class="inline-block py-1 px-3 rounded-full bg-orange-100 dark:bg-orange-900/30 text-primary font-semibold text-sm tracking-wide uppercase">
                Error 404
            </span>
        </div>
        <h1 class="text-8xl md:text-9xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-primary to-orange-400 mb-6 drop-shadow-sm">
            404
        </h1>
        <h2 class="text-3xl md:text-4xl font-bold text-gray-900 dark:text-white mb-6">
            Page Not Found
        </h2>
        <p class="text-lg text-gray-700 dark:text-gray-300 mb-10 max-w-lg mx-auto">
            The page you are looking for doesn't exist, has been moved, or is temporarily unavailable. Let's get you back on track.
        </p>
        <a href="index.html" class="inline-flex items-center justify-center gap-2 px-8 py-4 rounded-full bg-primary text-white font-bold hover:bg-orange-600 transition-all shadow-lg shadow-orange-500/30 transform hover:-translate-y-1">
            <i class="fa-solid fa-house"></i> Return to Homepage
        </a>
    </div>

    <!-- Custom Script -->
    <script src="assets/js/main.js"></script>
</body>
</html>
